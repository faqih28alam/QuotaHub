services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: quotahub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - quotahub-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quotahub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=quotahub
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - quotahub-network

  # 3. Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quotahub-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - quotahub-network

volumes:
  mongo_data:
    driver: local

networks:
  quotahub-network:
    driver: bridge
