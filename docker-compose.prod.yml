# Public server: Mongo + API + Caddy. The Next.js app stays on Vercel.
# Mongo has no published port. Only 80 and 443 are exposed on the host.
services:
  mongo:
    image: mongo:7.0
    container_name: quotahub-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - quotahub-network
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quotahub-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      ALLOW_SIGNUP: "false"
      MONGO_DB_NAME: quotahub
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/quotahub?authSource=admin
      TAILSCALE_SOCKS_PROXY: ${TAILSCALE_SOCKS_PROXY:-socks5h://tailscale:1055}
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    networks:
      - quotahub-network

  # Optional. Start with: docker compose -f docker-compose.prod.yml --profile tailscale up -d
  tailscale:
    image: tailscale/tailscale:stable
    container_name: quotahub-tailscale
    restart: unless-stopped
    profiles: ["tailscale"]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SOCKS5_SERVER: ":1055"
    volumes:
      - tailscale_state:/var/lib/tailscale
    networks:
      - quotahub-network

  caddy:
    image: caddy:2
    container_name: quotahub-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - quotahub-network

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
  tailscale_state:

networks:
  quotahub-network:
    driver: bridge
